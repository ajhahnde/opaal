# Documentation blocks are discovered from documentation_roots. The ordered
# rules cover every block and distinguish runnable user input from output,
# protocol/config text, architecture diagrams, and operational commands whose
# stronger owner is an existing CI, target, long-running, or approval gate.

[[documentation_rule]]
path = "README.md"
first_block = 1
last_block = 4
classification = "executed-or-gated"
evidence_owner = "launcher-frontends,language-server,standard-ci,target-build"

[[documentation_rule]]
path = "docs/architecture.md"
first_block = 1
last_block = 11
classification = "explanatory-model"
evidence_owner = "ci/check_flash_v1_exercises.py"

[[documentation_rule]]
path = "docs/development.md"
first_block = 1
last_block = 63
classification = "development-command-or-reference"
evidence_owner = "standard-ci-and-specialized-gates"

[[documentation_rule]]
path = "docs/language-guide.md"
first_block = 1
last_block = 65
classification = "executed-language-example"
evidence_owner = "documentation-language-examples"

[[documentation_rule]]
path = "docs/scripting.md"
first_block = 1
last_block = 66
classification = "executed-script-or-interaction-example"
evidence_owner = "documentation-scripting-examples"

# Every retained production compatibility marker has a current v1-or-later
# owner. Tests and historical records are evidence rather than executable
# compatibility paths and are not scanned here.

[[compatibility]]
id = "analysis-control"
path = "crates/flash-runtime/src/module.rs"
marker = "preserves legacy checker and execution analysis behavior"
classification = "current-v1-internal-owner"
owner = "shared-checker-planner-lsp-analysis"

[[compatibility]]
id = "execution-loaders"
path = "crates/flash-runtime/src/module.rs"
marker = "legacy execution loaders continue to use"
classification = "current-v1-internal-owner"
owner = "assembled-script-and-module-frontends"

[[compatibility]]
id = "namespace-evolution-machinery"
path = "crates/flash-runtime/src/command.rs"
marker = "Compatibility lifecycle metadata"
classification = "current-v1-and-later-owner"
owner = "language-major-built-in-namespace-policy"
