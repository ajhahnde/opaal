# Exhaustive user-path exercise contract for Flash v1. Each surface is bound to
# an assembled-product exercise or an explicit environment classification. The
# validator derives closed namespaces and documentation blocks from their live
# sources so new public behavior cannot appear without an exercise owner.

schema_version = 1
suite_version = 1
language_major = 1
host_runner = "exercises/run.py"
host_evidence = "exercises/evidence/host-v1.json"
target_matrix = "platforms/flashos-x86_64-target-matrix-v1.toml"
target_fixtures = "platforms/flashos-x86_64-runtime-fixtures-v1.toml"
compatibility_decision = "Flash v1.0 is the first supported compatibility baseline."
documentation_roots = [
  "README.md",
  "docs/architecture.md",
  "docs/development.md",
  "docs/language-guide.md",
  "docs/scripting.md",
]

[[environment]]
id = "host-posix"
availability = "available"
evidence_owner = "exercises/run.py"
limitations = "Qualifies the assembled host binaries on supported macOS or Linux; it does not establish FlashOS behavior."

[[environment]]
id = "flashos-qemu-x86_64"
availability = "available-in-candidate-ci"
evidence_owner = "ci/qemu_smoke.py"
limitations = "Qualifies the exact assembled image under one-vCPU QEMU; it is not physical-hardware evidence."

[[environment]]
id = "physical-flashos-x86_64"
availability = "approval-gated"
evidence_owner = "docs/hardware.md"
limitations = "A physical-device write requires read-only device identification and explicit operator approval."

# Language and value forms. A case may cover several inseparable source forms,
# but every named surface receives an exact user action and result in evidence.

[[surface]]
id = "source-and-literals"
category = "language"
members = ["utf8-source", "line-endings", "comments", "documentation-comments", "null", "bool", "int", "float", "single-quoted-string", "double-quoted-string", "escapes", "interpolation"]
exercise_case = "language-values"
negative_case = "invalid-source-and-literals"
flashos_owner = "target-matrix:v1-language-values-and-control"

[[surface]]
id = "collections-and-access"
category = "language"
members = ["list", "record", "range-exclusive", "range-inclusive", "index", "member", "membership", "equality", "ordering"]
