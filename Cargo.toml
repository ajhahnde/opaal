[workspace]
resolver = "3"
members = [
    "crates/flash-syntax",
    "crates/flash-runtime",
    "crates/flash-platform",
    "crates/flash-platform-posix",
    "crates/flash-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/ajhahnde/FlashOS"

[workspace.lints.rust]
rust_2018_idioms = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = "deny"
