schema_version = 1
suite_version = 1
result_schema = "opaal-performance-result-v1"
supported_host_os = ["linux", "macos"]
statistics = "median and nearest-rank p95 over retained raw samples"

[operational_artifacts]
plan_bytes = 1048576
plan_action_nodes = 1024
journal_bytes = 16777216
journal_line_limit = 100000
journal_terminal_reserve_bytes = 65536
journal_method = "maximum legal byte-bound journal; line ceiling retained as an exact-limit and first-excess property"

[profiles.smoke]
warmups = 0
samples = 1
stream_items = 100000

[profiles.qualification]
warmups = 3
samples = 15
stream_items = 5000000

[[cases]]
id = "host-startup-cold"
surface = "startup"
environment = "host"
metric = "elapsed_ns"
unit = "ns"
direction = "maximum"
sample_class = "cold"
budget_statistics = ["maximum"]

[[cases]]
id = "host-startup-warm"
surface = "startup"
environment = "host"
metric = "elapsed_ns"
unit = "ns"
direction = "maximum"
sample_class = "warm"
budget_statistics = ["p95"]

[[cases]]
id = "host-first-prompt-cold"
surface = "first_prompt"
environment = "host"
metric = "elapsed_ns"
unit = "ns"
direction = "maximum"
sample_class = "cold"
budget_statistics = ["maximum"]

[[cases]]
id = "host-first-prompt-warm"
surface = "first_prompt"
environment = "host"
metric = "elapsed_ns"
unit = "ns"
direction = "maximum"
sample_class = "warm"
budget_statistics = ["p95"]

[[cases]]
id = "host-structured-stream-memory-warm"
surface = "structured_stream_memory"
environment = "host"
metric = "peak_rss_bytes"
unit = "bytes"
direction = "maximum"
sample_class = "warm"
budget_statistics = ["maximum"]

[[cases]]
id = "host-completion-cold"
surface = "completion_latency"
environment = "host"
metric = "elapsed_ns"
unit = "ns"
direction = "maximum"
sample_class = "cold"
budget_statistics = ["maximum"]

[[cases]]
id = "host-completion-warm"
surface = "completion_latency"
environment = "host"
