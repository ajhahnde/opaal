[package]
name = "opaal-runtime"
description = "Runtime and execution planning for OPAAL"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
opaal-platform = { path = "../opaal-platform" }
opaal-syntax = { path = "../opaal-syntax" }
# The JSON format library. These are the first external crates to reach the
# shipped image, so both are exactly pinned with default features off and no
# derive machinery. JSON is parsed through a visitor straight into `Value`
# rather than into `serde_json::Value`, so object key order survives by
# construction and the `preserve_order` feature — which would pull in
# `indexmap`, `hashbrown`, and `equivalent` — is deliberately not enabled.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
semver = "=1.0.28"
sha2 = "=0.10.9"
toml = { version = "=0.8.23", default-features = false, features = ["parse"] }
# Terminal presentation measures display cells rather than bytes or Unicode
# scalar values. Keep the small, host-free width table exactly pinned because
# this dependency is part of the standalone OPAAL host runtime.
unicode-width = "=0.2.2"
unicode-normalization = "=0.1.24"

[dev-dependencies]
opaal-platform-posix = { path = "../opaal-platform-posix" }

[[bin]]
name = "opaal-status-fixture"
path = "../../tests/fixtures/status.rs"
test = false
bench = false
doc = false

[[bin]]
name = "opaal-job-observer-fixture"
path = "../../tests/fixtures/process_observer.rs"
test = false
bench = false
doc = false

[[bin]]
name = "opaal-stream-fixture"
path = "../../tests/fixtures/stream.rs"
test = false
bench = false
doc = false

[lints]
workspace = true
