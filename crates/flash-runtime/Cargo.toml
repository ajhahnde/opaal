[package]
name = "flash-runtime"
description = "Runtime and execution planning for Flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flash-platform = { path = "../flash-platform" }
flash-syntax = { path = "../flash-syntax" }
# The JSON format library. These are the first external crates to reach the
# shipped image, so both are exactly pinned with default features off and no
# derive machinery. JSON is parsed through a visitor straight into `Value`
# rather than into `serde_json::Value`, so object key order survives by
# construction and the `preserve_order` feature — which would pull in
# `indexmap`, `hashbrown`, and `equivalent` — is deliberately not enabled.
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
# Terminal presentation measures display cells rather than bytes or Unicode
# scalar values. Keep the small, host-free width table exactly pinned because
    # this dependency reaches the shipped FlashOS image.
unicode-width = "=0.2.2"

[dev-dependencies]
flash-platform-posix = { path = "../flash-platform-posix" }

[[bin]]
name = "flash-status-fixture"
path = "../../tests/fixtures/status.rs"
test = false
bench = false
doc = false

[[bin]]
name = "flash-job-observer-fixture"
path = "../../tests/fixtures/process_observer.rs"
test = false
bench = false
doc = false

[[bin]]
name = "flash-stream-fixture"
path = "../../tests/fixtures/stream.rs"
test = false
bench = false
doc = false

[lints]
workspace = true
