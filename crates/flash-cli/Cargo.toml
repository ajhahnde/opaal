[package]
name = "flash-cli"
description = "Command-line and interactive client for Flash"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "fsh"
path = "src/main.rs"

[[bin]]
name = "flash-e2e-process-observer-fixture"
path = "../../tests/fixtures/process_observer.rs"
test = false
bench = false
doc = false

[[bin]]
name = "flash-e2e-hangup-observer-fixture"
path = "tests/fixtures/hangup_observer.rs"
test = false
bench = false
doc = false

[[bin]]
name = "flash-e2e-status-fixture"
path = "../../tests/fixtures/status.rs"
test = false
bench = false
doc = false

[[bin]]
name = "flash-e2e-stream-fixture"
path = "../../tests/fixtures/stream.rs"
test = false
bench = false
doc = false

[[bin]]
name = "flash-terminal-editor-fixture"
path = "../../tests/fixtures/terminal_editor.rs"
test = false
bench = false
doc = false

[dependencies]
flash-platform = { path = "../flash-platform" }
flash-platform-posix = { path = "../flash-platform-posix" }
flash-runtime = { path = "../flash-runtime" }
flash-syntax = { path = "../flash-syntax" }

[target.'cfg(target_os = "redox")'.dependencies]
flash-platform-flashos = { path = "../flash-platform-flashos" }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
fd-lock = "=4.0.4"
nu-ansi-term = "=0.50.3"
reedline = { version = "=0.49.0", default-features = false }
rustix = { version = "=1.1.4", features = ["fs", "process"] }

# The PTY acceptance harness composes a pseudoterminal from rustix directly
# rather than pulling a new crate; these features stay out of the shipped binary.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dev-dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process", "pty", "termios"] }

[lints]
workspace = true
