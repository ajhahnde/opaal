[package]
name = "opaal-migrate"
description = "Read-only Flash 1 to OPAAL 1 source migration analysis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "opaal-migrate-flash-v1"
path = "src/main.rs"

[dependencies]
opaal-syntax = { path = "../opaal-syntax", features = ["flash-v1-migration"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }

[lints]
workspace = true
