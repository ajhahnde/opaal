# Architectural classification of Flash's platform requirements for the
# current x86_64 FlashOS integration. A native or shimmed verdict identifies
# the implementation route; target-runtime qualification remains pending.

schema_version = 1
platform = "flashos"
architecture = "x86_64"
target = "x86_64-unknown-redox"
platform_baseline = "flashos-x86_64.toml"
capability_evidence = "flashos-x86_64-capability-evidence.toml"
operation_map = "flashos-x86_64-operation-map.toml"
contract_source = "components/flash/crates/flash-platform/src/lib.rs"
selected_adapter = "flash-platform-posix::PosixPlatform"
classification = "complete"
target_qualification = "pending"

[semantics]
native = "The complete requirement has an existing Flash-internal, Rust standard-library, or configured-relibc route and needs no FlashOS-specific compatibility code."
shimmed = "Existing target primitives are sufficient, but Flash must add explicit FlashOS-specific adapter or policy code."
deliberately_unsupported = "Flash intentionally will not provide the requirement on this target and must report a precise unsupported-capability diagnostic."
kernel_work = "No current userland route can satisfy the requirement; any implementation requires separately authorized kernel work."
aggregation = "A capability takes the strongest operation verdict in kernel-work, deliberately-unsupported, shimmed, native order."
qualification = "Classification selects an implementation route; only later target-runtime evidence may qualify behavior as supported."

