# Per-operation map from Flash's portable capability requirements to the
# current x86_64 FlashOS Rust, relibc, and Redox userland seams. Mapping a seam
# records where an operation crosses the boundary; it does not classify the
# operation or capability as native, adapted, unsupported, or kernel work.

schema_version = 1
platform = "flashos"
architecture = "x86_64"
target = "x86_64-unknown-redox"
platform_baseline = "flashos-x86_64.toml"
capability_evidence = "flashos-x86_64-capability-evidence.toml"
contract_source = "components/flash/crates/flash-platform/src/lib.rs"
selected_adapter = "flash-platform-posix::PosixPlatform"
classification = "deferred"

[compiler_source]
repository = "https://gitlab.redox-os.org/redox-os/rust.git"
selector_kind = "branch"
selector = "redox-2026-05-24"
revision = "unknown"
mapping_scope = "public-std-api"

[libc_source]
repository = "https://gitlab.redox-os.org/redox-os/relibc.git"
mapping_revision = "5f6afb52692e62dae79154f4dbec2d0e79a07602"
binary_revision = "6571dca5b4a5f2619a42d4de196f8b787d649a8b"
mapping_scope = "configured-source"

