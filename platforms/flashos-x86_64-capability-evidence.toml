[[runtime_evidence]]
id = "qemu-terminal-editor"
path = "ci/qemu_smoke.py"
markers = [
  "# Interactive editing. This is the only place the raw-mode editor is proven",
  'edit_mark = submit_line(b"pwz\x7fd", b">> pwd")',
  'collect_until(b"\r\n/home/user", edit_mark)',
]
observation = "The current image enters the target-only raw editor, applies byte editing, submits the corrected row, and produces the expected internal-command value. History recall, multiline input, Ctrl-C cancellation, and prompt recovery remain covered by host pseudoterminal acceptance, not claimed by this bounded target observation."

