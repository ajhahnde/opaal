[[runtime_evidence]]
id = "qemu-terminal-editor"
path = "components/flash/platforms/flashos-x86_64-runtime-fixtures-v1.toml"
markers = [
  'id = "interactive-editing"',
  'input_hex = "70777a7f64"',
  'expect = "\r\n/home/user"',
]
observation = "The QEMU runner consumes the reusable suite, enters the target-only raw editor, applies byte editing, submits the corrected row, and produces the expected internal-command value. The same steps are rendered for manually observed real systems. History recall, multiline input, Ctrl-C cancellation, and prompt recovery remain outside this bounded observation."

[[runtime_evidence]]
id = "qemu-runtime-bringup"
path = "components/flash/platforms/flashos-x86_64-runtime-fixtures-v1.toml"
markers = [
  'input = "^echo pwd>x"',
  'input = "^echo p|^cat"',
  'input = "ls|length"',
  'input = "wait %4"',
  'input = "^sleep 1&&true&"',
  'reject = ["error[RUN001]"]',
]
observation = "The QEMU runner consumes the reusable suite and checks logical cwd, script creation and execution, a two-member external byte pipeline, structured directory data, a waited background child, and a waited conditional-chain supervisor without a runtime diagnostic. The same ordered steps and expectations are available to manually observed real systems."

