# Evidence inventory for comparing Flash's portable capability contract with
# the current x86_64 FlashOS integration path. This file records observations;
# it does not classify a capability as native, adapted, unsupported, or as
# requiring kernel work.

schema_version = 1
platform = "flashos"
architecture = "x86_64"
target = "x86_64-unknown-redox"
platform_baseline = "flashos-x86_64.toml"
contract_source = "components/flash/crates/flash-platform/src/lib.rs"
selected_adapter = "flash-platform-flashos::FlashOsPlatform"
classification = "deferred"

[[source_evidence]]
id = "redox-selects-flashos"
path = "components/flash/crates/flash-cli/src/main.rs"
markers = [
  '#[cfg(target_os = "redox")]',
  'use flash_platform_flashos::FlashOsPlatform;',
  'type NativePlatform = FlashOsPlatform;',
  'FlashOsPlatform::new()',
]
observation = "Every Redox execution mode instantiates the dedicated FlashOS adapter while retaining the target-only terminal editor."

