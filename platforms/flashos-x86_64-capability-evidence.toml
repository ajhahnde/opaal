  'b"echo nope > /etc/smoke.txt"',
]
observation = "The current image performs a successful redirection and readback and observes a denied redirection outside the user boundary."

[[runtime_evidence]]
id = "qemu-foreground-return"
path = "ci/qemu_smoke.py"
markers = [
  "# A direct non-zero external completion must return through the managed",
  'b"cat /home/user/definitely-missing"',
  'collect_until(EMPTY_PROMPT_ROW, missing_mark)',
]
observation = "The current interactive image returns from a direct foreground child failure to a usable prompt through the managed foreground path."

