  'collect_until(b"hallo", shell_start)',
]
observation = "The current image streams bytes through an external pipeline and returns to the prompt."

[[runtime_evidence]]
id = "qemu-terminal-editor"
path = "ci/qemu_smoke.py"
markers = [
  "# Interactive editing. This is the only place the raw-mode editor is proven",
  'edit_mark = submit_line(b"echo hallo\x7f\x7fx", b">> echo halx")',
  'send(b"\x03")',
]
observation = "The current image enters the target-only raw editor, handles byte editing and recall, and restores an empty prompt after Ctrl-C abandons input."

[[runtime_evidence]]
id = "qemu-process-status"
path = "ci/qemu_smoke.py"
markers = [
  "# Exit status reaches the || branch.",
  'b"^false || echo fellback"',
  'collect_until(b"fellback", status_mark)',
]
observation = "The current image directly spawns an external command, observes its nonzero completion, and evaluates the fallback branch."

[[runtime_evidence]]
id = "qemu-file-actions"
path = "ci/qemu_smoke.py"
