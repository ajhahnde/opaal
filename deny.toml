# cargo-deny policy for the standalone OPAAL workspace.
#
# OPAAL uses edition 2024, resolver 3, and a pinned toolchain. This policy keeps
# every dependency addition visible to standalone security checks.

[advisories]
version = 2
# No ignores — an entry here must carry a comment justifying the exception.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# OPAAL itself uses MPL-2.0. Dependencies may use this reviewed set;
# Unicode-3.0 covers data tables in unicode-ident.
allow = [
    "Apache-2.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]

[bans]
# A duplicate version flags supply-chain bloat for review without blocking a
# legitimate transitive diamond.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Crates may come only from crates.io. Adding a git or private-registry source
# is a supply-chain decision that must be made explicitly here.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
