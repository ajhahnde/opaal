name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: language-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Check documented CLI help
        run: python3 ci/check_docs.py --cli target/debug/opaal

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compile Python validators
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m compileall -q ci benchmarks

      - name: Test Python validators
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'

      - name: Check public documentation
        run: python3 ci/check_docs.py

      - name: Enforce the public boundary
        run: python3 ci/check_public_boundary.py

      - name: Validate the current product contract
        run: python3 ci/check_product.py source

      - name: Reject whitespace errors
        run: git show --check --format= HEAD

  fuzz:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Acquire the fuzz checker
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Exercise the supported fuzz targets
        run: fuzz/run-smoke.sh 1000

      - name: Repeat Random and I/O fuzzing with a fixed seed
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          corpus=$(mktemp -d)
          trap 'rm -rf "$corpus"' EXIT
          for target in random_limits stdio_limits; do
            mkdir "$corpus/$target"
            cargo +nightly fuzz run --fuzz-dir fuzz "$target" "$corpus/$target" "fuzz/seeds/$target" -- -runs=1000 -seed=1 -max_len=4096 -timeout=10 -rss_limit_mb=2048
          done

  operational-core-linux:
    name: operational-core-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Build the optimized non-publishing candidate
        run: cargo build --release --locked -p opaal-cli --bin opaal

      - name: Test the complete workspace on Linux
        run: cargo test --workspace --locked --no-fail-fast

      - name: Qualify the complete Linux workflow
        run: python3 ci/qualify_operational_core.py --profile qualification

      - name: Exercise the permanent performance lane
        run: python3 benchmarks/run.py --profile smoke

  operational-core-macos:
    name: operational-core-macos
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Build the optimized non-publishing candidate
        run: cargo build --release --locked -p opaal-cli --bin opaal

      - name: Compile workspace tests before signing
        run: cargo test --workspace --locked --no-run

      - name: Enforce native image invalidation policy
        run: |
          # Cargo restores visible binaries from these copies even on a cached run.
          for binary in target/debug/opaal target/debug/opaal-standard-host-fixture target/debug/deps/opaal-* target/debug/deps/opaal_standard_host_fixture-* target/debug/deps/random_native-* target/debug/deps/io_receipt_native-* target/release/opaal; do
            [ -f "$binary" ] && [ -x "$binary" ] || continue
            codesign --display --verbose=4 "$binary"
            codesign --force --sign - --options kill "$binary"
            codesign --verify --strict "$binary"
          done

      - name: Test the complete workspace on macOS
        run: cargo test --workspace --locked --no-fail-fast

      - name: Qualify the macOS process boundary
        run: python3 ci/qualify_operational_core.py --profile qualification

      - name: Validate the full macOS performance profile
        run: python3 benchmarks/run.py --profile qualification

  operational-core-linux-aarch64:
    name: operational-core-linux-aarch64
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
      options: --privileged --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Install pinned Rust and native qualification tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y binutils build-essential ca-certificates curl git python3 shellcheck strace
          curl -fsSLo "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.28.2/aarch64-unknown-linux-gnu/rustup-init
          printf '%s  %s\n' e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c "$RUNNER_TEMP/rustup-init" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-host aarch64-unknown-linux-gnu --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Mark the mounted checkout safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned Jammy Python for native qualification
        run: |
          curl -fsSLo "$RUNNER_TEMP/python.tar.gz" https://github.com/actions/python-versions/releases/download/3.12.15-36805895057/python-3.12.15-linux-22.04-arm64.tar.gz
          printf '%s  %s\n' 753766e28452fe7946c9e7bab7428c02ece786da64d066af9bd390ac38ae3b79 "$RUNNER_TEMP/python.tar.gz" | sha256sum --check
          # Preserve Python's compiled prefix; the runner remaps action env paths to /__t.
          python_prefix=/opt/hostedtoolcache/Python/3.12.15/arm64
          mkdir -p "$python_prefix"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$python_prefix"
          ln -s "$python_prefix/bin/python3" /usr/local/bin/python3
          echo /usr/local/bin >> "$GITHUB_PATH"
          env -i /usr/local/bin/python3 -c 'import sys, tomllib; assert sys.version_info[:3] == (3, 12, 15), sys.version'

      - name: Verify the native ARM host and Jammy userland
        run: |
          test "$(uname -m)" = aarch64
          python3 -c 'import platform, tomllib; assert platform.libc_ver() == ("glibc", "2.35"), platform.libc_ver(); assert tuple(map(int, platform.release().split(".")[:2])) >= (6, 3), platform.release()'

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -vV

      - name: Check formatting and build the full optimized candidate
        run: |
          cargo fmt --all -- --check
          cargo build --workspace --locked --release

      - name: Verify ELF architecture, GLIBC floor, and deterministic archive identity
        run: |
          for binary in target/release/opaal target/release/opaal-language-server; do
            readelf -hW "$binary" | grep -Fx '  Class:                             ELF64'
            readelf -hW "$binary" | grep -Fx '  Data:                              2'\''s complement, little endian'
            readelf -hW "$binary" | grep -Fx '  Machine:                           AArch64'
            readelf --version-info --wide "$binary" | python3 -c 'import re,sys; versions=[tuple(map(int,x.split("."))) for x in re.findall(r"GLIBC_(\d+\.\d+)",sys.stdin.read())]; assert versions and max(versions) <= (2,35), max(versions) if versions else "no GLIBC symbols"'
          done
          python3 ci/package_release.py --platform linux-aarch64
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          (cd dist && sha256sum --check "opaal-v${candidate_version}-linux-aarch64.tar.gz.sha256")

      - name: Test the complete workspace on native Linux AArch64
        run: cargo test --workspace --locked --no-fail-fast

      - name: Clippy and documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo doc --workspace --no-deps --locked

      - name: Qualify the complete native Linux workflow
        run: python3 ci/qualify_operational_core.py --profile qualification

      - name: Exercise the native ARM performance smoke profile
        run: python3 benchmarks/run.py --profile smoke --output "$RUNNER_TEMP/benchmark-smoke-linux-aarch64.json"

  random-native-linux:
    name: random-native-linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record source, kernel and toolchain identity
        run: |
          mkdir -p dist/random-native-linux
          git rev-parse HEAD > dist/random-native-linux/source.txt
          uname -a > dist/random-native-linux/host.txt
          rustup show active-toolchain || rustup toolchain install
          rustc -vV > dist/random-native-linux/toolchain.txt
      - name: Build native qualification programs
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked -p opaal-cli --bin opaal -p opaal-platform-posix --bin opaal-standard-host-fixture 2>&1 | tee dist/random-native-linux/build.log
          sha256sum target/release/opaal target/release/opaal-standard-host-fixture > dist/random-native-linux/program-hashes.txt
      - name: Qualify native host and public Random boundaries
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p opaal-platform-posix --test standard_host_worker -- --test-threads=1 2>&1 | tee dist/random-native-linux/native.log
          cargo test --locked -p opaal-cli --test random_golden -- --test-threads=1 2>&1 | tee dist/random-native-linux/cli.log
          cargo test --locked -p opaal-cli --test random_native 2>&1 | tee dist/random-native-linux/combined.log
      - name: Qualify actual native failures with failed journal persistence
        run: python3 ci/qualify_random_failures.py --binary target/release/opaal --output dist/random-native-linux
      - name: Observe maximum byte fill timing and process resources
        shell: bash
        run: |
          for sample in 1 2 3 4 5; do
            /usr/bin/time -v target/release/opaal-standard-host-fixture maximum > "dist/random-native-linux/maximum-${sample}.log" 2>&1
          done
      - name: Retain native qualification evidence even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: random-native-linux
          path: dist/random-native-linux/
          if-no-files-found: error

  data-processing-linux:
    name: data-processing-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the candidate programs
        run: cargo build --release --workspace --locked
      - name: Check the classified source formatting inventory
        run: python3 ci/check_source_formatting.py --cli target/release/opaal
      - name: Package the exact programs and examples
        run: python3 ci/package_data_processing.py --platform linux-x86_64
      - name: Package the exact source formatting fixtures
        run: python3 ci/package_source_formatting.py
      - name: Qualify source formatting outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_source_formatting.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-source-formatting.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/source-formatting-linux.json
      - name: Qualify installation and report processing outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_data_processing.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --examples "dist/opaal-v${candidate_version}-data-processing.tar.gz" \
            --expected-version "${candidate_version}" --expected-source "$(git rev-parse HEAD)" \
            --platform linux-x86_64 --report dist/data-processing-linux.json
      - name: Qualify scalar numeric report workflows
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_numeric_operations.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/numeric-operations-linux.json
      - name: Package the exact Random fixtures
        run: python3 ci/package_random_values.py
      - name: Qualify bounded Random outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_random_values.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-random-values.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/random-values-linux.json
      - name: Package the exact standard-stream references
        run: python3 ci/package_standard_input_output.py
      - name: Qualify the processor and CI job check outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_standard_input_output.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-standard-input-output.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/standard-input-output-linux.json
      - name: Package the exact Docker image check reference
        run: python3 ci/package_docker_image_checks.py
      - name: Qualify saved Docker image checks outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_docker_image_checks.py --offline \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-docker-image-checks.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/docker-image-checks-linux.json
      - name: Package the exact controlled native tool reference
        run: python3 ci/package_controlled_native_tools.py
      - name: Qualify saved repository checks outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_controlled_native_tools.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-controlled-native-tools.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --output "${RUNNER_TEMP}/controlled-native-tools"
      - name: Qualify native standard I/O and failed journal persistence
        run: python3 ci/qualify_standard_io_failures.py --binary target/release/opaal --output dist/standard-io-native-linux
      - name: Retain repository check replay files
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/controlled-native-tools" ]; then
            tar -czf dist/controlled-native-tools-linux-evidence.tar.gz \
              -C "${RUNNER_TEMP}" controlled-native-tools
          fi
      - name: Retain candidate identity and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-processing-linux
          path: dist/*
          if-no-files-found: error

  data-processing-macos:
    name: data-processing-macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the candidate programs
        run: cargo build --release --workspace --locked
      - name: Enforce native image invalidation policy before packaging
        run: |
          codesign --display --verbose=4 target/release/opaal
          codesign --force --sign - --options kill target/release/opaal
          codesign --verify --strict target/release/opaal
      - name: Check the classified source formatting inventory
        run: python3 ci/check_source_formatting.py --cli target/release/opaal
      - name: Package the exact programs and examples
        run: python3 ci/package_data_processing.py --platform macos-arm64
      - name: Package the exact source formatting fixtures
        run: python3 ci/package_source_formatting.py
      - name: Qualify source formatting outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_source_formatting.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-source-formatting.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/source-formatting-macos.json
      - name: Qualify installation and report processing outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_data_processing.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --examples "dist/opaal-v${candidate_version}-data-processing.tar.gz" \
            --expected-version "${candidate_version}" --expected-source "$(git rev-parse HEAD)" \
            --platform macos-arm64 --report dist/data-processing-macos.json
      - name: Qualify scalar numeric report workflows
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_numeric_operations.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/numeric-operations-macos.json
      - name: Package the exact Random fixtures
        run: python3 ci/package_random_values.py
      - name: Qualify bounded Random outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_random_values.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-random-values.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/random-values-macos.json
      - name: Package the exact standard-stream references
        run: python3 ci/package_standard_input_output.py
      - name: Qualify the processor and CI job check outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_standard_input_output.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-standard-input-output.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/standard-input-output-macos.json
      - name: Package the exact Docker image check reference
        run: python3 ci/package_docker_image_checks.py
      - name: Qualify saved Docker image checks outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_docker_image_checks.py --offline \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-docker-image-checks.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/docker-image-checks-macos.json
      - name: Package the exact controlled native tool reference
        run: python3 ci/package_controlled_native_tools.py
      - name: Qualify saved repository checks outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_controlled_native_tools.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-controlled-native-tools.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --output "${RUNNER_TEMP}/controlled-native-tools"
      - name: Qualify native standard I/O and failed journal persistence
        run: python3 ci/qualify_standard_io_failures.py --binary target/release/opaal --output dist/standard-io-native-macos
      - name: Retain repository check replay files
        if: always()
        run: |
          if [ -d "${RUNNER_TEMP}/controlled-native-tools" ]; then
            tar -czf dist/controlled-native-tools-macos-evidence.tar.gz \
              -C "${RUNNER_TEMP}" controlled-native-tools
          fi
      - name: Retain candidate identity and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-processing-macos
          path: dist/*
          if-no-files-found: error

  data-processing-linux-aarch64:
    name: data-processing-linux-aarch64
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
      options: --privileged --init
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - name: Install pinned Rust, Docker 29.9.0, and qualification tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y acl binutils build-essential ca-certificates curl git libcap2-bin python3 shellcheck strace util-linux
          curl -fsSLo "$RUNNER_TEMP/rustup-init" https://static.rust-lang.org/rustup/archive/1.28.2/aarch64-unknown-linux-gnu/rustup-init
          printf '%s  %s\n' e3853c5a252fca15252d07cb23a1bdd9377a8c6f3efa01531109281ae47f841c "$RUNNER_TEMP/rustup-init" | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-host aarch64-unknown-linux-gnu --default-toolchain none --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          cat > /etc/apt/sources.list.d/docker.sources <<'EOF'
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: jammy
          Components: stable
          Architectures: arm64
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          docker_version='5:29.9.0-1~ubuntu.22.04~jammy'
          DEBIAN_FRONTEND=noninteractive apt-get install -y "docker-ce=$docker_version" "docker-ce-cli=$docker_version" containerd.io

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Mark the mounted checkout safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install pinned Jammy Python for native qualification
        run: |
          curl -fsSLo "$RUNNER_TEMP/python.tar.gz" https://github.com/actions/python-versions/releases/download/3.12.15-36805895057/python-3.12.15-linux-22.04-arm64.tar.gz
          printf '%s  %s\n' 753766e28452fe7946c9e7bab7428c02ece786da64d066af9bd390ac38ae3b79 "$RUNNER_TEMP/python.tar.gz" | sha256sum --check
          # Preserve Python's compiled prefix; the runner remaps action env paths to /__t.
          python_prefix=/opt/hostedtoolcache/Python/3.12.15/arm64
          mkdir -p "$python_prefix"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$python_prefix"
          ln -s "$python_prefix/bin/python3" /usr/local/bin/python3
          echo /usr/local/bin >> "$GITHUB_PATH"
          env -i /usr/local/bin/python3 -c 'import sys, tomllib; assert sys.version_info[:3] == (3, 12, 15), sys.version'

      - name: Verify the native ARM host and Jammy userland
        run: |
          test "$(uname -m)" = aarch64
          python3 -c 'import platform, tomllib; assert platform.libc_ver() == ("glibc", "2.35"), platform.libc_ver(); assert tuple(map(int, platform.release().split(".")[:2])) >= (6, 3), platform.release()'

      - name: Start the isolated Docker 29.9.0 daemon
        run: |
          nohup dockerd --host="unix://$RUNNER_TEMP/docker.sock" --data-root="$RUNNER_TEMP/docker-data" --exec-root="$RUNNER_TEMP/docker-exec" --pidfile="$RUNNER_TEMP/docker.pid" --bridge=none --iptables=false > "$RUNNER_TEMP/dockerd.log" 2>&1 &
          for attempt in {1..60}; do
            if docker --host="unix://$RUNNER_TEMP/docker.sock" version --format '{{.Server.Version}}' 2>/dev/null | grep -Fxq '29.9.0'; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/dockerd.log"
          exit 1

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc -vV

      - name: Build and package the native candidate
        run: |
          cargo build --release --workspace --locked
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/package_release.py --platform linux-aarch64
          (cd dist && sha256sum --check "opaal-v${candidate_version}-linux-aarch64.tar.gz.sha256")

      - name: Build native observer test binaries
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          result = subprocess.run(["cargo", "test", "--release", "--workspace", "--locked", "--no-run", "--message-format=json"], capture_output=True, text=True)
          if result.returncode:
              sys.stderr.write(result.stderr)
              raise SystemExit(result.returncode)
          selected = {}
          wanted = {
              ("opaal-cli", "opaal_cli"): "PREPARATION_TEST_BINARY",
              ("opaal-cli", "controlled_native_tools"): "CLI_TEST_BINARY",
              ("opaal-platform-posix", "controlled_native_tools"): "POSIX_TEST_BINARY",
              ("opaal-runtime", "opaal_runtime"): "IMAGE_TEST_BINARY",
              ("opaal-runtime", "controlled_native_tools"): "PROCESS_TEST_BINARY",
              ("opaal-runtime", "workflow_artifacts"): "EVIDENCE_TEST_BINARY",
              ("opaal-lsp", "server_e2e"): "LSP_TEST_BINARY",
          }
          for line in result.stdout.splitlines():
              event = json.loads(line)
              if event.get("reason") != "compiler-artifact" or not event.get("executable"):
                  continue
              package = Path(event["manifest_path"]).parent.name
              key = (package, event["target"]["name"])
              if key in wanted:
                  selected[wanted[key]] = event["executable"]
          if set(selected) != set(wanted.values()):
              raise SystemExit(f"observer binaries differ: {sorted(selected)}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for key, value in sorted(selected.items()):
                  output.write(f"{key}={value}\n")
          PY

      - name: Package the exact native qualification fixtures
        run: |
          python3 ci/package_data_processing.py --platform linux-aarch64
          python3 ci/package_source_formatting.py
          python3 ci/package_random_values.py
          python3 ci/package_standard_input_output.py
          python3 ci/package_docker_image_checks.py
          python3 ci/package_controlled_native_tools.py

      - name: Qualify saved-input, numeric, Random, stream, and source workflows
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          archive="dist/opaal-v${candidate_version}-linux-aarch64.tar.gz"
          source_sha=$(git rev-parse HEAD)
          python3 ci/qualify_source_formatting.py --archive "$archive" --fixtures "dist/opaal-v${candidate_version}-source-formatting.tar.gz" --expected-source "$source_sha" --platform linux-aarch64 --report "$RUNNER_TEMP/source-formatting-linux-aarch64.json"
          python3 ci/qualify_data_processing.py --archive "$archive" --examples "dist/opaal-v${candidate_version}-data-processing.tar.gz" --expected-version "$candidate_version" --expected-source "$source_sha" --platform linux-aarch64 --report "$RUNNER_TEMP/data-processing-linux-aarch64.json"
          python3 ci/qualify_numeric_operations.py --archive "$archive" --expected-source "$source_sha" --platform linux-aarch64 --report "$RUNNER_TEMP/numeric-operations-linux-aarch64.json"
          python3 ci/qualify_random_values.py --archive "$archive" --fixtures "dist/opaal-v${candidate_version}-random-values.tar.gz" --expected-source "$source_sha" --platform linux-aarch64 --report "$RUNNER_TEMP/random-values-linux-aarch64.json"
          python3 ci/qualify_standard_input_output.py --archive "$archive" --fixtures "dist/opaal-v${candidate_version}-standard-input-output.tar.gz" --expected-source "$source_sha" --platform linux-aarch64 --report "$RUNNER_TEMP/standard-input-output-linux-aarch64.json"
          python3 ci/qualify_docker_image_checks.py --offline --archive "$archive" --fixtures "dist/opaal-v${candidate_version}-docker-image-checks.tar.gz" --expected-source "$source_sha" --platform linux-aarch64 --report "$RUNNER_TEMP/docker-image-checks-offline-linux-aarch64.json"

      - name: Qualify controlled process, image, and fault boundaries
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          archive="dist/opaal-v${candidate_version}-linux-aarch64.tar.gz"
          source_sha=$(git rev-parse HEAD)
          cc -O2 -Wall -Wextra -Werror tests/golden/controlled-external-tools/checker.c -o "$RUNNER_TEMP/native-fault-checker"
          python3 ci/qualify_controlled_native_tools.py --archive "$archive" --fixtures "dist/opaal-v${candidate_version}-controlled-native-tools.tar.gz" --expected-source "$source_sha" --platform linux-aarch64 --output "$RUNNER_TEMP/controlled-native-tools" --checker /usr/bin/shellcheck --fault-checker "$RUNNER_TEMP/native-fault-checker" --preparation-test-binary "$PREPARATION_TEST_BINARY" --image-test-binary "$IMAGE_TEST_BINARY" --evidence-test-binary "$EVIDENCE_TEST_BINARY" --process-test-binary "$PROCESS_TEST_BINARY" --cli-test-binary "$CLI_TEST_BINARY" --posix-test-binary "$POSIX_TEST_BINARY" --lsp-test-binary "$LSP_TEST_BINARY"
          python3 ci/qualify_random_failures.py --binary target/release/opaal --output "$RUNNER_TEMP/random-failures-linux-aarch64"
          python3 ci/qualify_standard_io_failures.py --binary target/release/opaal --output "$RUNNER_TEMP/standard-io-failures-linux-aarch64"

      - name: Load the deterministic ARM image and local multi-platform index
        run: |
          # Keep the runner's job-container exec on its own Docker daemon.
          export DOCKER_HOST="unix://$RUNNER_TEMP/docker.sock"
          docker version --format '{{json .}}' > "$RUNNER_TEMP/docker-version.json"
          docker load --input tests/golden/docker-image-checks/live/arm64-image.tar
          docker pull --platform linux/arm64 ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7
          docker image inspect --format '{{.Os}}/{{.Architecture}} {{json .Descriptor}}' opaal-qualification/arm64:fixture
          docker image inspect ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7

      - name: Qualify live Docker image inspection
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_docker_image_checks.py --live --archive "dist/opaal-v${candidate_version}-linux-aarch64.tar.gz" --fixtures "dist/opaal-v${candidate_version}-docker-image-checks.tar.gz" --docker /usr/bin/docker --socket "$RUNNER_TEMP/docker.sock" --image-ref opaal-qualification/arm64:fixture --image-id sha256:c13ecbac43418b19df646a517e67b212484a1a6c2db55c978f37bf56b6f5207f --image-revision opaal-arm64-live-fixture-v1 --index-ref ubuntu:22.04@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7 --expected-source "$(git rev-parse HEAD)" --platform linux-aarch64 --report "$RUNNER_TEMP/docker-live-linux-aarch64.json"

      - name: Retain native qualification reports and failure traces
        if: always()
        run: |
          for report in "$RUNNER_TEMP"/*linux-aarch64.json; do
            if [ -f "$report" ]; then cp "$report" dist/; fi
          done
          if [ -d "$RUNNER_TEMP/controlled-native-tools" ]; then
            tar -czf dist/controlled-native-tools-linux-aarch64-evidence.tar.gz \
              -C "$RUNNER_TEMP" controlled-native-tools
          fi

      - name: Retain candidate identity and qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-processing-linux-aarch64
          path: dist/*
          if-no-files-found: error

  required:
    name: required
    if: always()
    needs: [foundation, policy, fuzz, operational-core-linux, operational-core-macos, operational-core-linux-aarch64, data-processing-linux, data-processing-macos, data-processing-linux-aarch64]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every required job
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          OPERATIONAL_CORE_LINUX_RESULT: ${{ needs.operational-core-linux.result }}
          OPERATIONAL_CORE_MACOS_RESULT: ${{ needs.operational-core-macos.result }}
          OPERATIONAL_CORE_LINUX_AARCH64_RESULT: ${{ needs.operational-core-linux-aarch64.result }}
          DATA_PROCESSING_LINUX_RESULT: ${{ needs.data-processing-linux.result }}
          DATA_PROCESSING_MACOS_RESULT: ${{ needs.data-processing-macos.result }}
          DATA_PROCESSING_LINUX_AARCH64_RESULT: ${{ needs.data-processing-linux-aarch64.result }}
        run: |
          if [ "${FOUNDATION_RESULT}" != "success" ] ||
             [ "${POLICY_RESULT}" != "success" ] ||
             [ "${FUZZ_RESULT}" != "success" ] ||
             [ "${OPERATIONAL_CORE_LINUX_RESULT}" != "success" ] ||
             [ "${OPERATIONAL_CORE_MACOS_RESULT}" != "success" ] ||
             [ "${DATA_PROCESSING_LINUX_RESULT}" != "success" ] ||
             [ "${DATA_PROCESSING_MACOS_RESULT}" != "success" ] ||
             [ "${OPERATIONAL_CORE_LINUX_AARCH64_RESULT}" != "success" ] ||
             [ "${DATA_PROCESSING_LINUX_AARCH64_RESULT}" != "success" ]; then
            echo "foundation=${FOUNDATION_RESULT} policy=${POLICY_RESULT} fuzz=${FUZZ_RESULT} operational-core-linux=${OPERATIONAL_CORE_LINUX_RESULT} operational-core-macos=${OPERATIONAL_CORE_MACOS_RESULT}"
            echo "data-processing-linux=${DATA_PROCESSING_LINUX_RESULT} data-processing-macos=${DATA_PROCESSING_MACOS_RESULT}"
            echo "operational-core-linux-aarch64=${OPERATIONAL_CORE_LINUX_AARCH64_RESULT} data-processing-linux-aarch64=${DATA_PROCESSING_LINUX_AARCH64_RESULT}"
            exit 1
          fi
