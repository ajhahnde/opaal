name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: language-foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Build
        run: cargo build --workspace --locked

      - name: Check documented CLI help
        run: python3 ci/check_docs.py --cli target/debug/opaal

      - name: Tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  policy:
    name: repository-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compile Python validators
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m compileall -q ci benchmarks

      - name: Test Python validators
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s ci/tests -p 'test_*.py'

      - name: Check public documentation
        run: python3 ci/check_docs.py

      - name: Enforce the public boundary
        run: python3 ci/check_public_boundary.py

      - name: Validate the current product contract
        run: python3 ci/check_product.py source

      - name: Reject whitespace errors
        run: git show --check --format= HEAD

  fuzz:
    name: fuzz-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Acquire the fuzz checker
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install cargo-fuzz --version 0.13.2 --locked

      - name: Exercise the supported fuzz targets
        run: fuzz/run-smoke.sh 1000

      - name: Repeat Random fuzzing with a fixed seed
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          corpus=$(mktemp -d)
          trap 'rm -rf "$corpus"' EXIT
          cargo +nightly fuzz run --fuzz-dir fuzz random_limits "$corpus" fuzz/seeds/random_limits -- -runs=1000 -seed=1 -max_len=4096 -timeout=10 -rss_limit_mb=2048

  operational-core-linux:
    name: operational-core-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Build the optimized non-publishing candidate
        run: cargo build --release --locked -p opaal-cli --bin opaal

      - name: Test the complete workspace on Linux
        run: cargo test --workspace --locked --no-fail-fast

      - name: Qualify the complete Linux workflow
        run: python3 ci/qualify_operational_core.py --profile qualification

      - name: Exercise the permanent performance lane
        run: python3 benchmarks/run.py --profile smoke

  operational-core-macos:
    name: operational-core-macos
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Activate the pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - name: Build the optimized non-publishing candidate
        run: cargo build --release --locked -p opaal-cli --bin opaal

      - name: Test the complete workspace on macOS
        run: cargo test --workspace --locked --no-fail-fast

      - name: Qualify the macOS process boundary
        run: python3 ci/qualify_operational_core.py --profile qualification

      - name: Validate the full macOS performance profile
        run: python3 benchmarks/run.py --profile qualification

  random-native-linux:
    name: random-native-linux
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Record source, kernel and toolchain identity
        run: |
          mkdir -p dist/random-native-linux
          git rev-parse HEAD > dist/random-native-linux/source.txt
          uname -a > dist/random-native-linux/host.txt
          rustup show active-toolchain || rustup toolchain install
          rustc -vV > dist/random-native-linux/toolchain.txt
      - name: Build native qualification programs
        shell: bash
        run: |
          set -o pipefail
          cargo build --release --locked -p opaal-cli --bin opaal -p opaal-platform-posix --bin opaal-standard-host-fixture 2>&1 | tee dist/random-native-linux/build.log
          sha256sum target/release/opaal target/release/opaal-standard-host-fixture > dist/random-native-linux/program-hashes.txt
      - name: Qualify native host and public Random boundaries
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p opaal-platform-posix --test standard_host_worker -- --test-threads=1 2>&1 | tee dist/random-native-linux/native.log
          cargo test --locked -p opaal-cli --test random_golden -- --test-threads=1 2>&1 | tee dist/random-native-linux/cli.log
      - name: Qualify actual native failures with failed journal persistence
        run: python3 ci/qualify_random_failures.py --binary target/release/opaal --output dist/random-native-linux
      - name: Observe maximum byte fill timing and process resources
        shell: bash
        run: |
          for sample in 1 2 3 4 5; do
            /usr/bin/time -v target/release/opaal-standard-host-fixture maximum > "dist/random-native-linux/maximum-${sample}.log" 2>&1
          done
      - name: Retain native qualification evidence even after failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: random-native-linux
          path: dist/random-native-linux/
          if-no-files-found: error

  data-processing-linux:
    name: data-processing-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the candidate programs
        run: cargo build --release --workspace --locked
      - name: Check the classified source formatting inventory
        run: python3 ci/check_source_formatting.py --cli target/release/opaal
      - name: Package the exact programs and examples
        run: python3 ci/package_data_processing.py --platform linux-x86_64
      - name: Package the exact source formatting fixtures
        run: python3 ci/package_source_formatting.py
      - name: Qualify source formatting outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_source_formatting.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-source-formatting.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/source-formatting-linux.json
      - name: Qualify installation and report processing outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_data_processing.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --examples "dist/opaal-v${candidate_version}-data-processing.tar.gz" \
            --expected-version "${candidate_version}" --expected-source "$(git rev-parse HEAD)" \
            --platform linux-x86_64 --report dist/data-processing-linux.json
      - name: Qualify scalar numeric report workflows
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_numeric_operations.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/numeric-operations-linux.json
      - name: Package the exact Random fixtures
        run: python3 ci/package_random_values.py
      - name: Qualify bounded Random outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_random_values.py \
            --archive "dist/opaal-v${candidate_version}-linux-x86_64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-random-values.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform linux-x86_64 \
            --report dist/random-values-linux.json
      - name: Retain candidate identity and qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-processing-linux
          path: dist/*
          if-no-files-found: error

  data-processing-macos:
    name: data-processing-macos
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Activate the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build the candidate programs
        run: cargo build --release --workspace --locked
      - name: Check the classified source formatting inventory
        run: python3 ci/check_source_formatting.py --cli target/release/opaal
      - name: Package the exact programs and examples
        run: python3 ci/package_data_processing.py --platform macos-arm64
      - name: Package the exact source formatting fixtures
        run: python3 ci/package_source_formatting.py
      - name: Qualify source formatting outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_source_formatting.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-source-formatting.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/source-formatting-macos.json
      - name: Qualify installation and report processing outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_data_processing.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --examples "dist/opaal-v${candidate_version}-data-processing.tar.gz" \
            --expected-version "${candidate_version}" --expected-source "$(git rev-parse HEAD)" \
            --platform macos-arm64 --report dist/data-processing-macos.json
      - name: Qualify scalar numeric report workflows
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_numeric_operations.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/numeric-operations-macos.json
      - name: Package the exact Random fixtures
        run: python3 ci/package_random_values.py
      - name: Qualify bounded Random outside the checkout
        run: |
          candidate_version=$(python3 -c 'from ci.package_release import VERSION; print(VERSION)')
          python3 ci/qualify_random_values.py \
            --archive "dist/opaal-v${candidate_version}-macos-arm64.tar.gz" \
            --fixtures "dist/opaal-v${candidate_version}-random-values.tar.gz" \
            --expected-source "$(git rev-parse HEAD)" --platform macos-arm64 \
            --report dist/random-values-macos.json
      - name: Retain candidate identity and qualification evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: data-processing-macos
          path: dist/*
          if-no-files-found: error

  required:
    name: required
    if: always()
    needs: [foundation, policy, fuzz, operational-core-linux, operational-core-macos, data-processing-linux, data-processing-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce every required job
        env:
          FOUNDATION_RESULT: ${{ needs.foundation.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
          OPERATIONAL_CORE_LINUX_RESULT: ${{ needs.operational-core-linux.result }}
          OPERATIONAL_CORE_MACOS_RESULT: ${{ needs.operational-core-macos.result }}
          DATA_PROCESSING_LINUX_RESULT: ${{ needs.data-processing-linux.result }}
          DATA_PROCESSING_MACOS_RESULT: ${{ needs.data-processing-macos.result }}
        run: |
          if [ "${FOUNDATION_RESULT}" != "success" ] ||
             [ "${POLICY_RESULT}" != "success" ] ||
             [ "${FUZZ_RESULT}" != "success" ] ||
             [ "${OPERATIONAL_CORE_LINUX_RESULT}" != "success" ] ||
             [ "${OPERATIONAL_CORE_MACOS_RESULT}" != "success" ] ||
             [ "${DATA_PROCESSING_LINUX_RESULT}" != "success" ] ||
             [ "${DATA_PROCESSING_MACOS_RESULT}" != "success" ]; then
            echo "foundation=${FOUNDATION_RESULT} policy=${POLICY_RESULT} fuzz=${FUZZ_RESULT} operational-core-linux=${OPERATIONAL_CORE_LINUX_RESULT} operational-core-macos=${OPERATIONAL_CORE_MACOS_RESULT}"
            echo "data-processing-linux=${DATA_PROCESSING_LINUX_RESULT} data-processing-macos=${DATA_PROCESSING_MACOS_RESULT}"
            exit 1
          fi
